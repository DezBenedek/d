[package]
name = "d"
version = "1.1.0"
edition = "2024"
rust-version = "1.85"
description = "A small, fast command-line toolkit for everyday developer tasks on macOS"
authors = ["Dezső Benedek <benedek@dezso.hu>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/DezBenedek/d"
homepage = "https://dcli.dezso.hu"
documentation = "https://github.com/DezBenedek/d"
keywords = ["cli", "git", "macos", "i18n"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "=4.4.18", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"      # meretre optimalizal (nem sebessegre)
lto = true           # link-time optimization: kidobja a holt kodot
codegen-units = 1    # jobb optimalizacio, cserebe lassabb forditas
strip = true         # debug szimbolumok eltavolitasa a binarisbol
panic = "abort"      # nincs unwinding kod -> kisebb binaris
